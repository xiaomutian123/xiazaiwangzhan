<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站源代码测试 · CSS & JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="test-card">
    <h1>
      🧪 测试实验室
      <span>CSS & JS</span>
    </h1>
    <div class="subhead">
      ⚡ 交互式源代码测试 · 点击按钮 / 输入文本 / 切换主题
    </div>

    <!-- 计数器 -->
    <div class="counter-section">
      <div class="counter-display">
        <span class="counter-label">计数器</span>
        <span id="counterValue" class="counter-value">0</span>
      </div>
      <div class="btn-group">
        <button class="btn" id="decrementBtn" title="减少">−1</button>
        <button class="btn btn-primary" id="incrementBtn" title="增加">+1</button>
        <button class="btn btn-outline" id="resetBtn" title="重置为零">重置</button>
      </div>
    </div>

    <!-- 实时回显 -->
    <div class="input-group">
      <label for="echoInput">📝 实时回显 (输入任何内容)</label>
      <div class="input-wrapper">
        <input type="text" id="echoInput" placeholder="例如：Hello CSS & JS ..." autocomplete="off">
        <button class="btn" id="clearInputBtn" title="清空输入">清空</button>
      </div>
      <div class="echo-area">
        <span class="echo-label">回显</span>
        <span id="echoDisplay" class="echo-value">（等待输入…）</span>
      </div>
    </div>

    <!-- 主题切换 -->
    <div class="theme-switch">
      <div class="theme-label">
        <span>🌓</span> 主题模式
      </div>
      <div class="toggle-indicator">
        <span id="themeStatus">浅色</span>
        <button class="toggle-btn" id="themeToggleBtn" aria-label="切换主题">
          <div class="knob"></div>
        </button>
      </div>
    </div>

    <div class="footnote">
      ✅ 测试网站源代码 · 纯CSS + JavaScript (无外部依赖)
    </div>
  </div>

  <!-- JS 放在 body 末尾，确保 DOM 已加载 -->
  <script src="script.js"></script>
</body>
</html>
